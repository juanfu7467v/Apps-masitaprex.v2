app = "agente-de-pruevas"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  OLLAMA_HOST = "127.0.0.1:11434"
  OLLAMA_MODEL = "qwen2.5:3b"
  OLLAMA_KEEP_ALIVE = "5m"
  PULL_MODEL = "true"

[mounts]
  source = "ollama_models"
  destination = "/root/.ollama"
  initial_size = "20gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

[[vm]]
  memory = "4096mb"
  cpu_kind = "shared"
  cpus = 2
